name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package plugin
        run: |
          cd dist
          zip -r "../univer-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css

      - name: Delete the old 1.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete 1.2.0 --yes --cleanup-tag || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Univer ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            univer-${{ github.ref_name }}.zip
